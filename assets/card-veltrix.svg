<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Veltrix: Workforce platform with kiosk time-in/time-out, real-time attendance tracking, automated payroll, employee management and reporting.">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb950"/><stop offset=".5" stop-color="#39c5cf"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".07"/></pattern>
  <style>
    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.float,.spin,.ping,.blink{animation:none}}
  </style>
  <radialGradient id="ga"><stop offset="0" stop-color="#58a6ff" stop-opacity="0.2"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="600" height="300" rx="16" fill="#0d1117"/>
<rect width="600" height="300" rx="16" fill="url(#dots)"/>
<circle cx="560" cy="20" r="250" fill="url(#ga)"/>
<rect x="32" y="32" width="56" height="56" rx="14" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".35"/>
<g transform="translate(44,44) scale(1.3333333333333333)"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7v5l3.5 2" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="106" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4" fill="#58a6ff">ATTENDANCE &amp; PAYROLL</text>
<text x="105" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f0f6fc" letter-spacing="-.5">Veltrix</text>
<circle cx="548" cy="60" r="20" fill="#161b22" stroke="#30363d"/>
<g transform="translate(539,51) scale(0.75)"><path d="M7 17 17 7 M8 7h9v9" fill="none" stroke="#9da7b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="32" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#9da7b3">Workforce platform with kiosk time-in/time-out,</text><text x="32" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#9da7b3">real-time attendance tracking, automated payroll,</text><text x="32" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#9da7b3">employee management and reporting.</text>
<g transform="translate(32,240)"><rect width="58" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="12" y="17.32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#9da7b3">React</text></g><g transform="translate(98,240)"><rect width="91" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="12" y="17.32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#9da7b3">TypeScript</text></g><g transform="translate(197,240)"><rect width="78" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="12" y="17.32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#9da7b3">Supabase</text></g><g transform="translate(283,240)"><rect width="71" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="12" y="17.32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#9da7b3">Zustand</text></g>
<rect x=".5" y=".5" width="599" height="299" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
