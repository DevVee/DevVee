<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="232" viewBox="0 0 1200 232" role="img" aria-label="Feb 2025 – Jun 2026: Freelance Web Developer, Self-employed · Batangas. Dec 2025 – Apr 2026: Student Intern (OJT), ICCBI Registrar's Office. Apr 2026: BS Computer Science, ICCBI · Magna Cum Laude. Jun 2026 – Now: Full-Stack Developer, ServiceCo · Contractor">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb950"/><stop offset=".5" stop-color="#39c5cf"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".07"/></pattern>
  <style>
    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.float,.spin,.ping,.blink{animation:none}}
  </style>
  <radialGradient id="gG"><stop offset="0" stop-color="#3fb950" stop-opacity="0.16"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient><linearGradient id="tl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a371f7"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
</defs>
