<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Let's build something together. Email princearveeavena@gmail.com">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb950"/><stop offset=".5" stop-color="#39c5cf"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".07"/></pattern>
  <style>
    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.float,.spin,.ping,.blink{animation:none}}
  </style>
  <radialGradient id="gG"><stop offset="0" stop-color="#3fb950" stop-opacity="0.2"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient><radialGradient id="gP"><stop offset="0" stop-color="#a371f7" stop-opacity="0.16"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="230" rx="20" fill="#0a0d12"/><rect width="1200" height="230" rx="20" fill="url(#dots)"/>
<circle cx="250" cy="230" r="380" fill="url(#gG)"/>
<circle cx="950" cy="0" r="380" fill="url(#gP)"/>
<rect x=".5" y=".5" width="1199" height="229" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
<text x="600" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#f0f6fc" letter-spacing="-.8">Let's build something <tspan fill="url(#brand)">together.</tspan></text>
<text x="600" y="124" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#9da7b3">Open to full-time roles, freelance projects and collaborations. Remote-friendly.</text>
<g transform="translate(451,152)">
  <rect width="298" height="46" rx="23" fill="url(#brand)"/>
  <text x="139" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0a0d12">princearveeavena@gmail.com</text>
  <g transform="translate(260,14) scale(0.75)"><path d="M7 17 17 7 M8 7h9v9" fill="none" stroke="#0a0d12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
</svg>
